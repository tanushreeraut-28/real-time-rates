services:
  - type: web
    name: real-time-rates-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://real-time-rates.vercel.app
      - key: REQUEST_TIMEOUT
        value: "10"
